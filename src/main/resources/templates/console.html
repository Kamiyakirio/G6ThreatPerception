<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>控制台主页</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <!--引入本地layui.css-->
  <link rel="stylesheet" href="/layui/css/layui.css" media="all">
  <!--引入本地自定义的admin、login.css-->
  <link rel="stylesheet" href="/layui/layuiAdmin/css/admin.css" media="all">
  <!-- 引入刚刚下载的 ECharts 文件 -->
  <script src="/js/echarts.min.js"></script>
</head>
<body>
<div class="layui-fluid">
  <div class="layui-row layui-col-space15">
    <!-- 左上角基础数据展示区域 -->
    <div class="layui-col-md6">
      <div class="layui-card">
        <div class="layui-card-header">基础数据</div>
        <div class="layui-card-body">
          <div class="layui-row layui-col-space10">
            <!-- 数据卡片1 -->
            <div class="layui-col-xs6">
              <div class="layui-card layui-bg-blue">
                <div class="layui-card-body layui-text-center">
                  <h3 class="layui-text-white">128</h3>
                  <p class="layui-text-white layui-opacity-70">今日访问量</p>
                </div>
              </div>
            </div>
            <!-- 数据卡片2 -->
            <div class="layui-col-xs6">
              <div class="layui-card layui-bg-green">
                <div class="layui-card-body layui-text-center">
                  <h3 class="layui-text-white">56</h3>
                  <p class="layui-text-white layui-opacity-70">新增用户</p>
                </div>
              </div>
            </div>
            <!-- 数据卡片3 -->
            <div class="layui-col-xs6">
              <div class="layui-card layui-bg-orange">
                <div class="layui-card-body layui-text-center">
                  <h3 class="layui-text-white">32</h3>
                  <p class="layui-text-white layui-opacity-70">处理工单</p>
                </div>
              </div>
            </div>
            <!-- 数据卡片4 -->
            <div class="layui-col-xs6">
              <div class="layui-card layui-bg-red">
                <div class="layui-card-body layui-text-center">
                  <h3 class="layui-text-white">8</h3>
                  <p class="layui-text-white layui-opacity-70">系统告警</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右上角风险等级分布图表区域 -->
    <div class="layui-col-md6">
      <div class="layui-card">
        <div class="layui-card-header">风险等级分布</div>
        <div class="layui-card-body">
          <!-- 为 ECharts 准备一个定义了宽高的 DOM -->
          <div id="riskChart" style="width: 100%;height:300px;"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="text/javascript" src="/layui/layui.js"></script>
<script type="text/javascript">
  layui.config({
    base: '/layui/layuiAdmin/' //静态资源所在路径
  }).extend({
    index: 'lib/index' //主入口模块
  }).use(['jquery', 'element'], function($, element){
    // 基于准备好的dom，初始化echarts实例
    var riskChart = echarts.init(document.getElementById('riskChart'));
    // 加载统计数据
    function loadStatistics() {
      $.ajax({
        url: '/log/statistics',
        type: 'GET',
        headers: {
          'Authorization': localStorage.getItem('token')
        },
        success: function (res) {
          if (res.code === 200) {
            // 更新图表
            updateRiskChart(res.data.riskDistribution || []);
          }
        },
        error: function (xhr, status, error) {
          console.error('加载统计数据失败:', error);
          // 如果请求失败，显示默认数据
          updateRiskChart([]);
        }
      });
    }
    // 更新风险图表
    function updateRiskChart(data) {
      // 处理数据格式，确保有4个等级的数据
      var chartData = [0, 0, 0, 0]; // 无风险、低风险、中风险、高风险
      if (data && data.length > 0) {
        data.forEach(function(item) {
          var riskLevel = parseInt(item.risk_level);
          var count = parseInt(item.count);
          if (riskLevel >= 0 && riskLevel < 4) {
            chartData[riskLevel] = count;
          }
        });
      }
      var option = {
        title: {
          text: '风险等级分布',
          left: 'center',
          textStyle: {
            fontSize: 16,
            fontWeight: 'bold'
          }
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: {
            type: 'shadow'
          },
          formatter: function(params) {
            return params[0].name + '<br/>' +
                    params[0].seriesName + ': ' + params[0].value + ' 条';
          }
        },
        grid: {
          left: '3%',
          right: '4%',
          bottom: '3%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          data: ['无风险', '低风险', '中风险', '高风险'],
          axisLabel: {
            fontSize: 12
          }
        },
        yAxis: {
          type: 'value',
          name: '数量',
          axisLabel: {
            fontSize: 12
          }
        },
        series: [{
          name: '日志数量',
          type: 'bar',
          data: chartData,
          itemStyle: {
            color: function(params) {
              var colors = ['#52c41a', '#faad14', '#fa8c16', '#f5222d'];
              return colors[params.dataIndex];
            }
          },
          label: {
            show: true,
            position: 'top',
            fontSize: 12
          }
        }]
      };
      riskChart.setOption(option);
    }
    // 页面加载完成后执行
    $(document).ready(function() {
      loadStatistics();
      // 窗口大小改变时重绘图表
      $(window).resize(function() {
        riskChart.resize();
      });
    });
  });
</script>
</body>
</html>
