<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>日志审计</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="/layui/layuiAdmin/css/admin.css" media="all">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .st{
            width: 270px!important;
        }
        .layui-form-label{
            width: 120px!important;
        }
        .xinghao{
            color: red!important;
        }
        #layuiadmin-form-useradmin {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .layui-form-item {
            text-align: center;
            margin-bottom: 20px;
        }
        .layui-input-block {
            margin: 0 auto;
            text-align: center;
        }
    </style>
</head>
<body>

<!--表单-->
<div class="layui-form" lay-filter="layuiadmin-form-useradmin" id="layuiadmin-form-useradmin" style="padding: 20px 0 0 0;">
    <input type="hidden" name="id">
    <!--  主机名  -->
    <div class="layui-form-item">
        <label class="layui-form-label">主机名<span class="xinghao">*</span></label>
        <div class="layui-input-inline st">
            <input type="text" name="hostName" lay-verify="required" placeholder="请输入主机名" autocomplete="off" class="layui-input" readonly>
        </div>
    </div>
    <!--  MAC地址  -->
    <div class="layui-form-item">
        <label class="layui-form-label">主机Mac地址<span class="xinghao">*</span></label>
        <div class="layui-input-inline st">
            <input type="text" name="macAddress" lay-verify="required" placeholder="请输入MAC地址" autocomplete="off" class="layui-input" readonly>
        </div>
    </div>

    <!--  开始时间  -->
    <div class="layui-form-item">
        <label class="layui-form-label">开始时间<span class="xinghao">*</span></label>
        <div class="layui-input-inline st">
            <input type="text" name="start_time" id="start_time" lay-verify="required" placeholder="请选择开始时间" autocomplete="off" class="layui-input">
        </div>
    </div>

    <!--  结束时间  -->
    <div class="layui-form-item">
        <label class="layui-form-label">结束时间<span class="xinghao">*</span></label>
        <div class="layui-input-inline st">
            <input type="text" name="end_time" id="end_time" lay-verify="required" placeholder="请选择结束时间" autocomplete="off" class="layui-input">
        </div>
    </div>

    <!--  提交 -->
    <div class="layui-form-item layui-hide">
        <input type="button" lay-submit lay-filter="LAY-user-front-submit" id="LAY-user-front-submit" value="确认">
    </div>
</div>

<script src="/layui/layui.js"></script>
<script>
    layui.config({
        base: '/layui/layuiAdmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'form', 'laydate', 'layer'], function(){
        var $ = layui.$
            ,form = layui.form
            ,layer = layui.layer
            ,laydate = layui.laydate;

        // 初始化日期时间选择器
        laydate.render({
            elem: '#start_time'
            ,type: 'datetime'
            ,format: 'yyyy-MM-dd HH:mm:ss'
            ,trigger: 'click'
        });

        laydate.render({
            elem: '#end_time'
            ,type: 'datetime'
            ,format: 'yyyy-MM-dd HH:mm:ss'
            ,trigger: 'click'
        });

        // 表单提交
        form.on('submit(LAY-user-front-submit)', function(data){
            // 获取表单数据
            var hostName = data.field.hostName;
            var macAddress = data.field.macAddress;
            var id = data.field.id;
            var start_time = data.field.start_time;
            var end_time = data.field.end_time;
            var detectlog = data.field.detectLog === 'true';

            // 验证时间范围
            var startDate = new Date(start_time);
            var endDate = new Date(end_time);
            if (startDate >= endDate) {
                layer.msg('结束时间必须大于开始时间', {icon: 5});
                return false;
            }

            // 发送请求
            $.ajax({
                url: '/log/log_detect',
                type: 'POST',
                headers: {
                    'Authorization': localStorage.getItem('token'),
                    'Content-Type': 'application/json;charset=utf-8'
                },
                data: JSON.stringify({
                    hostName: hostName,
                    macAddress: macAddress,
                    id: Number(id),
                    type: 'log',
                    detectLog: detectLog,
                    start_time: start_time,
                    end_time: end_time
                }),
                dataType: 'json',
                success: function(res) {
                    if (res.code == 0) {//成功
                        layer.msg(res.msg);//弹出提示
                        // 将探测结果保存到 localStorage
                        if (res.data) {
                            localStorage.setItem('detectionResults_' + id, JSON.stringify(res.data));
                        }
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layui.table.reload('LAY-user-manage'); //数据刷新
                        parent.layer.close(index); //关闭弹层
                    } else {//系统出问题
                        layer.msg(res.msg, {icon: 5});//弹出提示
                    }
                },
                error: function(xhr, status, error) {
                    layer.msg('请求失败：' + error, {icon: 5});
                }
            });
            
            return false; // 阻止表单跳转
        });
    })
</script>
</body>
</html>
