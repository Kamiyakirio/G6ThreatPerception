<script type="text/javascript">
    // 日期格式转换函数
    function formatDate(str) {
        if (str != null) {
            var now = new Date(str);
            var year = now.getFullYear();  //取得4位数的年份
            var month = now.getMonth() + 1;  //取得日期中的月份，其中0表示1月，11表示12月
            var date = now.getDate();      //返回日期月份中的天数（1到31）
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            return year + "-" + month + "-" + date + " " + hours + ":" + minutes + ":" + seconds;
        }
        return "";
    }
</script>

                                    macAddress: field.macAddress,
                                    id: Number(field.id),
                                    type: 'log',
                                    startTime: field.start_time,
                                    endTime: field.end_time,
                                    detectLog: field.detectLog === 'true'
                                }),

                                    if (res.code == 0) {//成功

                                        // 将探测结果保存到 localStorage
                                        if (res.data) {

                                    } else {//系统出问题

                                            dataType: "json",
                                            success: function (timeRes) {
                                                console.log('Latest log time response:', timeRes); // 添加调试日志
                                                if (timeRes.code === 0) {
                                                    // 发送定时同步请求
                                                    $.ajax({
                                                        url: "/log/set_sync_interval",
                                                        type: "post",
                                                        headers: {

                                                            'Content-Type': 'application/json;charset=utf-8'

                                                        contentType: "application/json;charset=utf-8",
                                                        dataType: "json",

                    layer.open({
                        type: 2,
                        title: 'AI日志分析结果',
                        area: ['60%', '60%'],
                        content: '/page/ai/aiResultTmpl2',
                        success: function (layero, index) {
                            let contentWindow = layero.find('iframe')[0].contentWindow;
                            contentWindow.postMessage(data.aiResult);
                        }
                    });
                } else {
                    layer.msg('正在将日志发送至AI分析，请稍候...');
                    var loadIndex = layer.load(1);
                    $.ajax({
                        url: '/log/ai/analysis',
                        method: 'post',
                        headers: {'Authorization': localStorage.getItem('token')},
                        contentType: 'application/json',
                        dataType: 'json',
                        data: JSON.stringify([data]),
                        success: function (response) {
                            layer.close(loadIndex);
                            let msg = response.msg || '';
                            layer.open({
                                type: 2,
                                title: 'AI日志分析结果',
                                area: ['60%', '60%'],
                                content: '/page/ai/aiResultTmpl2',
                                success: function (layero, index) {
                                    let contentWindow = layero.find('iframe')[0].contentWindow;
                                    contentWindow.postMessage(msg);
                                }
                            });
                            layui.table.reload('logTable');
                        },
                        error: function (xhr, status, error) {
                            layer.close(loadIndex);
                            layer.msg(error, {icon: 5});
                        }
                    });
                }
            }
        });
    })
    ;

</script>
</body>
</html>
