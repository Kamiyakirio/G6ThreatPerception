<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>基线检测</title>
    <link rel="stylesheet" href="/layui/css/layui.css" media="all">
</head>
<body>
    <div class="layui-form" lay-filter="layuiadmin-form-useradmin" id="layuiadmin-form-useradmin" style="padding: 20px 30px 0 0;">
        <div class="layui-form-item">
            <label class="layui-form-label">主机名</label>
            <div class="layui-input-block">
                <input type="text" name="hostName" lay-verify="required" placeholder="请输入主机名" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">MAC地址</label>
            <div class="layui-input-block">
                <input type="text" name="macAddress" lay-verify="required" placeholder="请输入MAC地址" autocomplete="off" class="layui-input">
            </div>
        </div>
        <input type="hidden" name="id">
        <div class="layui-form-item layui-hide">
            <input type="button" lay-submit lay-filter="LAY-user-front-submit" id="LAY-user-front-submit" value="确认">
        </div>
    </div>
    <script src="/layui/layui.js"></script>
    <script>
        layui.use(['form'], function() {
            var form = layui.form;
            form.render();
        });
    </script>
</body>
</html>
