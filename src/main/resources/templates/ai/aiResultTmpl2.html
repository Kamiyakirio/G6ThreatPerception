<!-- index.html -->
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Markdown 渲染器</title>
    <link rel="stylesheet" href="/css/mdstyle.css"/>
    <script src="/js/marked.min.js"></script>
</head>
<body>
<div class="container" id="output">
    <p>等待接收 Markdown 内容...</p>
<!--    <button class="reload-btn" onclick="handleReload()">重新生成结果</button>-->
</div>

<script src="/layui/layui.js"></script>
<script src="/js/jquery-3.7.1.min.js"></script>
<script>
    var index=999999;
    window.addEventListener('message', function (event) {
        const data = event.data;
        index = data.index;
        if (typeof data.data === 'string') {
            const htmlContent = marked.parse(data.data);
            document.getElementById('output').innerHTML = htmlContent +
                '<button class="reload-btn" onclick="handleReload()">重新生成结果</button>';
        } else if (data.data === undefined || data.data === "") {
            $(".reload-btn").hide();
        }
    });

    function handleReload() {
        if (window.parent && window.parent.returnData !== undefined) {
            window.parent.returnData = "data";
        }
        // 关闭当前 iframe 弹窗（通过 Layui 的 layer）
        window.parent.postMessage("__REGENERATE__", "*");
        const index = parent.layer.getFrameIndex(window.name);
        parent.layer.close(index);
    }
</script>
</body>
</html>
