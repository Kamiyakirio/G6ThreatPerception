<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>编辑用户</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" href="/layui/css/layui.css" media="all">
    <link rel="stylesheet" href="/layui/layuiAdmin/css/admin.css" media="all">
    <style>
        .st {
            width: 270px !important;
        }

        .layui-form-label {
            width: 120px !important;
        }

        .xinghao {
            color: red !important;
        }
    </style>
</head>
<body>

<!--表单-->
<div class="layui-fluid" style="padding: 20px;">
    <div class="layui-card">
        <div class="layui-form" lay-filter="layuiadmin-form-useradmin" id="layuiadmin-form-useradmin"
             style="padding: 20px 0 0 0;">
            <input type="hidden" name="id">
            <!--  用户名  -->
            <div class="layui-form-item">
                <label class="layui-form-label">选择主机：<span class="xinghao">*</span></label>
                <div class="layui-btn layui-btn-primary demo-dropdown-base" id="host-dropdown">
                    <span>下拉菜单</span>
                    <i class="layui-icon layui-icon-down layui-font-12"></i>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">漏洞选项：</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="scan-web" title="Web" lay-skin="primary">
                    <input type="checkbox" name="scan-sql" title="SQL" checked lay-skin="primary">
                    <input type="checkbox" name="scan-others" title="其他" lay-skin="primary">
                </div>
            </div>

            <!--  提交 -->
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn" lay-submit lay-filter="demo1">确认</button>
                </div>
            </div>

            <div class="layui-form-item layui-hide">
                <input type="button" class="layui-btn" lay-submit lay-filter="LAY-user-front-submit"
                       id="LAY-user-front-submit" value="确认">
            </div>
        </div>
    </div>
</div>

<script src="/layui/layui.js"></script>
<script>
    layui.config({
        base: '/layui/layuiAdmin/' //静态资源所在路径
    }).extend({
        index: 'lib/index' //主入口模块
    }).use(['index', 'layer', 'form', 'layedit', 'laydate'], function () {
        var $ = layui.$
            , form = layui.form
            , layer = layui.layer
            , laydate = layui.laydate
            , layedit = layui.layedit;

        //常规用法
        laydate.render({
            elem: '#hiredate'
        });

        var dropdown = layui.dropdown;
        // 单个渲染
        dropdown.render({
            elem: '#host-dropdown',
            url: "host/list",
            // …
        });

        //创建一个编辑器
        var editIndex = layedit.build('LAY_demo_editor');

        // 表单提交
        form.on('submit(LAY-user-front-submit)', function (data) {
            // 获取表单数据
            var hostName = data.field.hostName;
            var macAddress = data.field.macAddress;
            var detectAccount = data.field.detectAccount ? 1 : 0;
            var detectService = data.field.detectService ? 1 : 0;
            var detectProcess = data.field.detectProcess ? 1 : 0;
            var detectApp = data.field.detectApp ? 1 : 0;

            // 发送请求
            $.ajax({
                url: '/host/detect',
                type: 'POST',
                data: {
                    hostName: hostName,
                    macAddress: macAddress,
                    detectAccount: detectAccount,
                    detectService: detectService,
                    detectProcess: detectProcess,
                    detectApp: detectApp
                },
                success: function (res) {
                    if (res.code == 0) {//成功
                        layer.msg(res.msg);//弹出提示
                        table.reload('LAY-user-manage'); //数据刷新
                        layer.close(index); //关闭弹层
                    } else {//系统出问题
                        layer.msg(res.msg, {icon: 5});//弹出提示
                    }
                }
            });
        });
    })
</script>
</body>
</html>
